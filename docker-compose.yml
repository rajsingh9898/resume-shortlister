version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: talentai-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talentai
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: talentai-redis
    restart: always
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentai-app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/talentai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./storage:/app/storage

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentai-celery-worker
    command: celery -A tasks.celery_app worker --loglevel=info -P solo
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/talentai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app/backend
      - ./storage:/app/storage

volumes:
  pgdata:
