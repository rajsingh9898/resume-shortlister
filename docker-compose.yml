version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: talentai-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talentai
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
